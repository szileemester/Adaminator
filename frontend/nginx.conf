server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # connect-src lists both the production API and the local docker-compose API - this file is
    # shared by both builds and isn't templated per VITE_API_URL at image build time.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://adaminator-api.fly.dev http://localhost:5091; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA fallback so client-side routes (e.g. /tournaments/:id, /public/:token) resolve on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
